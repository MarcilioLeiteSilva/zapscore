name: zapscore_campeonato_baiano
description: "App do Campeonato Baiano."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  #UI
  cupertino_icons: ^1.0.8
  flutter_easyloading: ^3.0.5
  google_fonts: ^8.1.0
  flutter_svg: ^2.0.10+1
  gap: ^3.0.1
  pattern_formatter: ^4.0.1
  loading_animation_widget: ^1.2.1
  like_button: ^2.0.5
  syncfusion_flutter_datepicker: ^33.2.4
  chewie: ^1.8.5
  video_player: ^2.9.2
  font_awesome_flutter: ^11.0.0

  #LOGIC
  http: ^1.2.1
  go_router: ^17.2.2
  flutter_bloc: ^9.1.1
  intl: ^0.20.2
  shared_preferences: ^2.2.3
  image_picker: ^1.0.7
  url_launcher: ^6.3.2
  youtube_player_flutter: ^9.1.3
  flutter_inappwebview: ^6.1.5
  cached_network_image: ^3.4.1
  firebase_core: ^3.0.0
  firebase_messaging: ^15.0.0
  flutter_local_notifications: ^17.0.0
  share_plus: ^10.1.4
  google_mobile_ads: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.0

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "icones/icone_baiano.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#1D965C"
  image: "icones/icone_splash_baiano.png"
  android_gravity: center
  ios_content_mode: center
  android_12:
    image: "icones/icone_splash_baiano.png"
    color: "#1D965C"
  fullscreen: false

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - icones/
